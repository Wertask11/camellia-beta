<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>料金・解約・販売者情報 | Camellia</title><style>body{margin:0;background:#fff9f8;color:#342b2e;font:16px/1.8 system-ui,sans-serif}main{max-width:42rem;margin:auto;padding:24px 20px}h1{font-size:1.5rem}dt{font-weight:bold;margin-top:20px}dd{margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere}a{color:#9a3656;display:inline-block;padding:12px 0}p{overflow-wrap:anywhere}</style></head><body><main><a href="/?open=my">Camelliaへ戻る</a><h1>料金・解約・返金と販売者情報</h1><p>Camellia Plusは月額500円のプランです。無料の基本利用やCamellia IDに料金はかかりません。</p><p id="state" role="status">支払い受付の状態を確認しています…</p><dl id="details"></dl></main><script>
(async()=>{const state=document.getElementById('state');try{const r=await fetch('/api/camellia/billing-disclosure',{cache:'no-store'});if(!r.ok)throw Error();const v=await r.json();if(v.priceYen!==500||v.interval!=='month')throw Error();const labels={seller:'販売事業者',representative:'運営責任者',address:'所在地',contact:'お問い合わせ',paymentTiming:'支払い方法・時期',cancellation:'解約方法・利用期限',refund:'返金・取消'};for(const [key,label]of Object.entries(labels)){if(typeof v[key]!=='string')throw Error();const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=v[key];document.getElementById('details').append(dt,dd);}state.textContent='毎月自動更新します。無料体験からの自動加入はありません。申し込み前に以下をご確認ください。';}catch{document.getElementById('details').replaceChildren();state.textContent='支払い受付は準備中です。現在この画面から購入や課金はできません。販売者情報と解約・返金条件の確認が整ってから受け付けます。';}})();
</script></body></html>
