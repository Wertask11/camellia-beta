<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>My Tree 装飾デザイン案 | Camellia</title><style>body{background:#fffaf8;color:#503b42;margin:0;font:16px/1.8 system-ui}main{max-width:780px;margin:auto;padding:24px}h1{font-size:24px}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}figure{background:white;border:1px solid #eddce1;border-radius:24px;margin:0;padding:20px}img{width:100%;height:auto}figcaption{font-weight:600}a{color:#903753}</style></head><body><main><a href="/">Camelliaへ戻る</a><h1>My Treeの装飾デザイン案</h1><p>未承認のデザインです。この画面を開いても特典の取得や紹介の受付は始まりません。人を評価する点数や順位はありません。</p><section><figure><img src="quiet-leaves.svg" alt="淡い緑の葉で左右を囲む装飾"><figcaption>しずかな葉</figcaption></figure><figure><img src="camellia-petals.svg" alt="淡いピンクの花びらを上部に置いた装飾"><figcaption>花びらの余白</figcaption></figure><figure><img src="warm-ring.svg" alt="ベージュとピンクの細い輪で囲む装飾"><figcaption>あたたかな輪</figcaption></figure></section><p>取得した装飾は永久保有し、無料・Plus共通で選んで着脱できます。どれを特典として採用するかは運営確認後に決定します。</p></main></body></html>
